name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (for example, v2.0.0)"
        required: true
        type: string
      create_marketplace_release:
        description: "Publish to the VS Code Marketplace"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tags must use vX.Y.Z."
            exit 1
          }
          VERSION="${TAG#v}"
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$TAG")" ]] || {
            echo "::error::The checked-out commit does not match $TAG."
            exit 1
          }
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" == "$MANIFEST_VERSION" ]] || {
            echo "::error::Tag $TAG does not match package.json version $MANIFEST_VERSION."
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          npm run package
          PACKAGE="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          [[ -n "$PACKAGE" ]] || {
            echo "::error::VSIX package was not created."
            exit 1
          }
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          gh release create "$TAG" "$PACKAGE" \
            --verify-tag \
            --title "Build Compare Tools $VERSION" \
            --generate-notes \
            --notes "Professional release intelligence for Azure DevOps: native VS Code dashboard, guided onboarding, multi-environment profiles, risk analysis, Copilot summaries, Teams Adaptive Cards, history, drift analysis, exports, and work-item creation. Requires VS Code 1.91 or later and Microsoft authentication."

      - name: Publish to VS Code Marketplace
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.create_marketplace_release) ||
          (github.event_name == 'push' && env.VSCE_PAT != '')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: npx vsce publish --packagePath "$PACKAGE" --pat "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: npx ovsx publish "$PACKAGE" --pat "$OVSX_PAT"
