name: Bug report
description: Report a reproducible ReleaseLens problem
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: ReleaseLens version
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not include access tokens, webhook URLs, or confidential code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
