name: Product feedback
description: Suggest an improvement to ReleaseLens
title: "[Feedback] "
labels:
  - feedback
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Onboarding
        - Comparison
        - Release risk
        - Teams sharing
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should ReleaseLens solve better?
      placeholder: Describe the workflow and desired outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include tokens, webhook URLs, or confidential code.
